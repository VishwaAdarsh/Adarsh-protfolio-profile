<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ADARSH.V | Digital Universe</title>
    <script type="text/javascript">
      // GitHub Pages Single Page App Redirect
      // Decodes path and query and redirects back to index.html with query param
      var l = window.location;
      var pathSegments = l.pathname.split('/').filter(Boolean);
      var isGhPagesRepo = pathSegments.length > 0 && pathSegments[0] === 'adarsh-portfolio';
      var repoPrefix = isGhPagesRepo ? '/adarsh-portfolio' : '';
      var routePath = isGhPagesRepo 
        ? '/' + pathSegments.slice(1).join('/')
        : l.pathname;
      
      l.replace(
        l.protocol + '//' + l.host + repoPrefix + '/?' +
        (routePath.slice(1) ? 'p=' + encodeURIComponent(routePath.slice(1)) : '') +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to ADARSH.V Digital Universe...</p>
  </body>
</html>
